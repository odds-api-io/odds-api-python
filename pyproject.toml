[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odds-api-io"
version = "1.2.2"
description = "Official Python SDK for Odds-API.io, the sports betting odds API: live and pre-match odds from 450+ bookmakers across 34 sports, player props, golf outrights, closing lines, settlement, arbitrage, value bets and WebSocket"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Odds-API.io", email = "hello@odds-api.io"}
]
keywords = [
    "odds api",
    "sports odds api",
    "betting odds api",
    "sportsbook",
    "player props",
    "live odds",
    "odds feed",
    "outrights",
    "golf odds",
    "closing lines",
    "arbitrage",
    "value bets",
    "websocket",
    "pandas",
    "sports betting",
    "bookmakers",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.25.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
ws = ["websockets>=10.0"]
all = ["pandas>=1.3", "websockets>=10.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "responses>=0.23.0",
    "pandas>=1.3",
    "websockets>=10.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://odds-api.io"
"Get an API key" = "https://odds-api.io/pricing?ref=pypi"
Documentation = "https://docs.odds-api.io"
Repository = "https://github.com/odds-api-io/odds-api-python"
Issues = "https://github.com/odds-api-io/odds-api-python/issues"
Changelog = "https://github.com/odds-api-io/odds-api-python/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["odds_api*"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
