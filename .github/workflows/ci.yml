name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel and import it
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import odds_api; print(odds_api.__name__)"
      - name: Run tests if present
        run: |
          if [ -d tests ]; then
            python -m pip install pytest pytest-asyncio "responses>=0.23.0" "pandas>=1.3" "websockets>=10.0"
            python -m pytest
          fi
